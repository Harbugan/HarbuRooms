const overlay=document.querySelector('#overlay'),start=document.querySelector('#start');let playing=false;start.onclick=async()=>{try{if(!renderer.domElement.requestPointerLock)throw new Error('Pointer Lock is unavailable in this browser.');await renderer.domElement.requestPointerLock();}catch(error){document.querySelector('#error').textContent='Cannot capture mouse: '+error.message;console.error(error)}};document.addEventListener('pointerlockchange',()=>{playing=document.pointerLockElement===renderer.domElement;overlay.style.display=playing?'none':'flex';start.textContent=playing?'ENTER THE ROOMS':'CONTINUE EXPLORING'});document.addEventListener('mousemove',e=>{if(!playing)return;camera.rotation.y-=e.movementX*.002;camera.rotation.x=Math.max(-1.48,Math.min(1.48,camera.rotation.x-e.movementY*.002))});const keys=new Set();addEventListener('keydown',e=>{keys.add(e.code);if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>keys.clear());camera.position.set(8,1.7,8);

let last=performance.now(),elapsed=0;function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;if(playing){const f=Number(keys.has('KeyW')||keys.has('ArrowUp'))-Number(keys.has('KeyS')||keys.has('ArrowDown'));const s=Number(keys.has('KeyD')||keys.has('ArrowRight'))-Number(keys.has('KeyA')||keys.has('ArrowLeft'));if(f||s){const len=Math.hypot(f,s),speed=(keys.has('ShiftLeft')||keys.has('ShiftRight')?8:4.4)*dt;const yaw=camera.rotation.y,dx=(-Math.sin(yaw)*f+Math.cos(yaw)*s)/len*speed,dz=(-Math.cos(yaw)*f-Math.sin(yaw)*s)/len*speed;if(!collide(camera.position.x+dx,camera.position.z))camera.position.x+=dx;if(!collide(camera.position.x,camera.position.z+dz))camera.position.z+=dz;elapsed+=dt*11;camera.position.y=1.7+Math.sin(elapsed)*.035}else camera.position.y+=(1.7-camera.position.y)*.12;updateChunks()}}renderer.render(scene,camera)}updateChunks();requestAnimationFrame(frame);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
